name: Récupération quotidienne des vols (OpenSky -> Google Drive)

on:
  schedule:
    # 04:17 UTC chaque jour (heure décalée pour éviter la charge au pile de l'heure)
    - cron: "17 4 * * *"
  workflow_dispatch: {}
    # permet de déclencher le script manuellement depuis l'onglet "Actions" de GitHub,
    # utile pour tester la configuration avant d'attendre le prochain passage planifié

jobs:
  fetch-flights:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Exécution du script de récupération
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          AIRCRAFT_ICAO24: "a0dd81"
        run: python fetch_flights.py
